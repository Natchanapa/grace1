<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | PEACH & BOLD</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            PEACH<span>&</span>BOLD
        </a>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

        <nav class="nav-menu" id="navMenu">

            <a href="index.html">
                Home
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="work.html">
                Work
            </a>

            <a href="process.html">
                Process
            </a>

            <a href="contact.html"
               class="contact-button active">
                Let's Talk ↗
            </a>

        </nav>

    </div>

</header>


<main>

<section class="contact-section">

    <div class="container contact-grid">


        <div class="contact-info">

            <p class="eyebrow">
                START A PROJECT
            </p>

            <h1>
                GOT A<br>
                GOOD<br>
                <span>IDEA?</span>
            </h1>

            <p>
                เล่าไอเดียของคุณให้เราฟัง
                แล้วมาสร้างอะไรที่คนอยากจำ
                ไปด้วยกัน
            </p>

            <div class="contact-details">

                hello@peachbold.studio

                <br>

                Bangkok, Thailand ✦

            </div>

        </div>


        <form class="contact-form"
              id="contactForm">


            <label>

                ชื่อ / บริษัท

                <input
                    type="text"
                    name="name"
                    placeholder="Your name"
                    required
                >

            </label>


            <label>

                อีเมล

                <input
                    type="email"
                    name="email"
                    placeholder="hello@example.com"
                    required
                >

            </label>


            <label>

                สนใจบริการ

                <select name="service">

                    <option>
                        Web Design
                    </option>

                    <option>
                        Front-End Development
                    </option>

                    <option>
                        Creative Direction
                    </option>

                    <option>
                        Full Website
                    </option>

                </select>

            </label>


            <label>

                เล่าโปรเจกต์ให้เราฟัง

                <textarea
                    name="message"
                    rows="6"
                    placeholder="Tell us about your project..."
                ></textarea>

            </label>


            <button
                type="submit"
                class="button black-button full-button">

                SEND MESSAGE ↗

            </button>


        </form>

    </div>

</section>

</main>


<footer>

    <div class="container footer-content">

        <div class="logo">
            PEACH<span>&</span>BOLD
        </div>

        <p>
            Creative ideas, coded with care.
        </p>

        <a href="index.html">
            Back Home ↗
        </a>

    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
